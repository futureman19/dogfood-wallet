name: publish
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

# Serialize all releases; never cancel an in-flight publication.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Trusted Publishing requires npm >=11.5.1; do not rely on runner defaults.
      - run: npm install --global npm@11.15.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Check tag matches package version
        run: node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Tag must match package version");'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run verify:package
      - run: npm publish --provenance --access public
